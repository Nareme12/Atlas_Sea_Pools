<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sea Pools: case examples</title>

<style>

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #242424 !important;
    font-family: Arial, sans-serif;
}

.gallery {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 8px;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}


/* TITLE */

.title {
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
}


/* MAIN AREA */

.main {
    width: 100%;
    max-width: 760px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 16px;
}


/* IMAGE */

.image-container {
    width: 520px;
    height: 172px;

    overflow: hidden;
    flex-shrink: 1;
}

.image-container img {
    width: 100%;
    height: 172px;

    object-fit: cover;
    display: block;

    user-select: none;
    -webkit-user-drag: none;
}


/* INFORMATION */

.info {
    width: 155px;
    height: 172px;

    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;

    color: #ffffff;
}

.name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.2;

    margin-bottom: 11px;
}

.data {
    margin-bottom: 7px;
}

.label {
    font-size: 8px;
    color: #999999;

    text-transform: uppercase;
    letter-spacing: 0.4px;

    margin-bottom: 2px;
}

.value {
    font-size: 10px;
    color: #dddddd;
}

.photography {
    font-style: italic;
}


/* NAVIGATION */

.navigation {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 12px;

    margin-top: 8px;
}

.arrow {
    background: transparent;
    border: none;

    color: #ffffff;

    font-size: 20px;
    line-height: 1;

    cursor: pointer;

    padding: 2px 8px;
}

.arrow:hover {
    opacity: 0.7;
}

.counter {
    min-width: 30px;

    text-align: center;

    font-size: 9px;
    color: #aaaaaa;
}

</style>
</head>

<body>

<div class="gallery">


    <!-- TITLE -->

    <div class="title">
        Sea Pools: case examples
    </div>


    <!-- MAIN CONTENT -->

    <div class="main">


        <!-- IMAGE -->

        <div class="image-container">

            <img
                id="poolImage"
                src=""
                alt=""
            >

        </div>


        <!-- INFORMATION -->

        <div class="info">

            <div
                class="name"
                id="poolName">
            </div>


            <div class="data">

                <div class="label">
                    Country
                </div>

                <div
                    class="value"
                    id="poolCountry">
                </div>

            </div>


            <div class="data">

                <div class="label">
                    Photography
                </div>

                <div
                    class="value photography"
                    id="poolPhotography">
                </div>

            </div>


            <!-- NAVIGATION UNDER PHOTOGRAPHY -->

            <div class="navigation">

                <button
                    class="arrow"
                    onclick="previousImage()"
                    aria-label="Previous image">
                    ‹
                </button>


                <div
                    class="counter"
                    id="counter">
                    1 / 6
                </div>


                <button
                    class="arrow"
                    onclick="nextImage()"
                    aria-label="Next image">
                    ›
                </button>

            </div>

        </div>

    </div>

</div>


<script>


/* SEA POOL DATA */

const pools = [

    {
        name: "Avalon Rock Pool",
        country: "Australia",
        photography: "Thomas Yohei",
        image: "https://images.unsplash.com/photo-1599552894420-661f2ae0da78?q=80&w=1633&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "La Libertad Sea Pool",
        country: "El Salvador",
        photography: "Meeg von Haartman",
        image: "https://images.unsplash.com/photo-1735770515751-9b49f00d2d8c?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Piscina Azenhas do Mar",
        country: "Portugal",
        photography: "Bea Vallejo",
        image: "https://images.unsplash.com/photo-1660083310880-441eb40f40bf?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Charco del Palo",
        country: "Spain",
        photography: "Jordi Vich Navarro",
        image: "https://images.unsplash.com/photo-1719338388195-3587dad59abf?q=80&w=1503&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Glencairn Tidal Pool",
        country: "South Africa",
        photography: "Simon Barber",
        image: "https://images.unsplash.com/photo-1662537748445-b2e851d18366?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Bude Sea Pool",
        country: "United Kingdom",
        photography: "Nick Russil",
        image: "https://images.unsplash.com/photo-1639406077808-9dd59d374b63?q=80&w=1471&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    }

];


/* CURRENT IMAGE */

let current = 0;


/* SHOW IMAGE */

function showImage(index) {

    current = index;

    const pool = pools[current];


    document.getElementById("poolImage").src =
        pool.image;


    document.getElementById("poolImage").alt =
        pool.name;


    document.getElementById("poolName").textContent =
        pool.name;


    document.getElementById("poolCountry").textContent =
        pool.country;


    document.getElementById("poolPhotography").textContent =
        pool.photography;


    document.getElementById("counter").textContent =
        (current + 1) + " / " + pools.length;

}


/* NEXT IMAGE */

function nextImage() {

    current++;

    if (current >= pools.length) {
        current = 0;
    }

    showImage(current);

}


/* PREVIOUS IMAGE */

function previousImage() {

    current--;

    if (current < 0) {
        current = pools.length - 1;
    }

    showImage(current);

}


/* INITIAL IMAGE */

showImage(0);

</script>

</body>
</html>
