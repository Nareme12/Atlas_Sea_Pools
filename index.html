<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sea Pool Gallery</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #242424 !important;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .gallery {
        width: 100%;
        height: 100vh;
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .pool-name {
        font-size: 20px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 12px;
        color: #ffffff;
    }

    .image-container {
        width: 100%;
        height: 260px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        flex-shrink: 0;
    }

    .image-container img {
        max-width: 45%;
        max-height: 260px;
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
    }

    .details {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        font-size: 14px;
        color: #d8d8d8;
    }

    .country {
        text-align: left;
    }

    .author {
        text-align: right;
        font-style: italic;
    }

    .navigation {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        gap: 25px;
    }

    .arrow {
        background: transparent;
        border: none;
        color: #ffffff;
        font-size: 28px;
        cursor: pointer;
        padding: 4px 12px;
        line-height: 1;
    }

    .arrow:hover {
        opacity: 0.7;
    }

    .counter {
        min-width: 45px;
        text-align: center;
        font-size: 14px;
        color: #cccccc;
    }
</style>
</head>

<body>

<div class="gallery">

    <div class="pool-name" id="poolName">
        Avalon Rock Pool
    </div>

    <div class="image-container">
        <img id="poolImage"
             src="https://images.unsplash.com/photo-1599552894420-661f2ae0da78?q=80&w=1633&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
             alt="Avalon Rock Pool"
             draggable="false">
    </div>

    <div class="details">
        <div class="country" id="poolCountry">
            Country: Australia
        </div>

        <div class="author" id="poolAuthor">
            Author: Thomas Yohei
        </div>
    </div>

    <div class="navigation">

        <button class="arrow" onclick="previousImage()" aria-label="Previous image">
            &#8592;
        </button>

        <div class="counter" id="counter">
            1 / 5
        </div>

        <button class="arrow" onclick="nextImage()" aria-label="Next image">
            &#8594;
        </button>

    </div>

</div>


<script>

const pools = [

    {
        name: "Avalon Rock Pool",
        country: "Australia",
        author: "Thomas Yohei",
        image: "https://images.unsplash.com/photo-1599552894420-661f2ae0da78?q=80&w=1633&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "La Libertad Sea Pool",
        country: "El Salvador",
        author: "Meeg von Haartman",
        image: "https://images.unsplash.com/photo-1735770515751-9b49f00d2d8c?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Piscina Azenhas do Mar",
        country: "Portugal",
        author: "Bea Vallejo",
        image: "https://images.unsplash.com/photo-1660083310880-441eb40f40bf?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Glencairn Tidal Pool",
        country: "South Africa",
        author: "Simon Barber",
        image: "https://images.unsplash.com/photo-1662537748445-b2e851d18366?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Bude Sea Pool",
        country: "United Kingdom",
        author: "Nick Russil",
        image: "https://images.unsplash.com/photo-1639406077808-9dd59d374b63?q=80&w=1471&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    }

];

let currentIndex = 0;


function showImage(index) {

    currentIndex = index;

    const pool = pools[currentIndex];

    document.getElementById("poolName").textContent = pool.name;

    document.getElementById("poolImage").src = pool.image;

    document.getElementById("poolImage").alt = pool.name;

    document.getElementById("poolCountry").textContent =
        "Country: " + pool.country;

    document.getElementById("poolAuthor").textContent =
        "Author: " + pool.author;

    document.getElementById("counter").textContent =
        (currentIndex + 1) + " / " + pools.length;
}


function nextImage() {

    currentIndex++;

    if (currentIndex >= pools.length) {
        currentIndex = 0;
    }

    showImage(currentIndex);
}


function previousImage() {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = pools.length - 1;
    }

    showImage(currentIndex);
}

</script>

</body>
</html>
