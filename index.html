<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sea Pool Gallery</title>

<style>

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #242424 !important;
    font-family: Arial, sans-serif;
}

.gallery {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 15px;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* TÍTULO */

.title {
    color: #ffffff;
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 15px;
}

/* ZONA PRINCIPAL */

.main {
    width: 100%;
    max-width: 850px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 22px;
}

/* IMAGEN */

.image-container {
    width: 620px;
    height: 350px;

    overflow: hidden;
    flex-shrink: 1;
}

.image-container img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    display: block;

    user-select: none;
    -webkit-user-drag: none;
}

/* INFORMACIÓN */

.info {
    width: 190px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;

    color: #ffffff;
}

.name {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.25;

    margin-bottom: 20px;
}

.data {
    margin-bottom: 12px;
}

.label {
    font-size: 11px;
    color: #999999;
    text-transform: uppercase;
    letter-spacing: 0.5px;

    margin-bottom: 3px;
}

.value {
    font-size: 14px;
    color: #dddddd;
}

.author {
    font-style: italic;
}

/* NAVEGACIÓN */

.navigation {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 20px;

    margin-top: 18px;
}

.arrow {
    background: transparent;
    border: none;

    color: #ffffff;

    font-size: 25px;
    line-height: 1;

    cursor: pointer;

    padding: 4px 12px;
}

.arrow:hover {
    opacity: 0.7;
}

.counter {
    min-width: 40px;

    text-align: center;

    font-size: 12px;
    color: #aaaaaa;
}

</style>
</head>

<body>

<div class="gallery">

    <div class="title">
        Sea Pool Gallery
    </div>

    <div class="main">

        <!-- IMAGEN -->
        <div class="image-container">
            <img id="poolImage" src="" alt="">
        </div>

        <!-- INFORMACIÓN -->
        <div class="info">

            <div class="name" id="poolName"></div>

            <div class="data">
                <div class="label">Country</div>
                <div class="value" id="poolCountry"></div>
            </div>

            <div class="data">
                <div class="label">Author</div>
                <div class="value author" id="poolAuthor"></div>
            </div>

        </div>

    </div>

    <!-- FLECHAS -->
    <div class="navigation">

        <button class="arrow" onclick="previousImage()">
            ‹
        </button>

        <div class="counter" id="counter">
            1 / 6
        </div>

        <button class="arrow" onclick="nextImage()">
            ›
        </button>

    </div>

</div>


<script>

const pools = [

    {
        name: "Avalon Rock Pool",
        country: "Australia",
        author: "Thomas Yohei",
        image: "https://images.unsplash.com/photo-1599552894420-661f2ae0da78?q=80&w=1633&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "La Libertad Sea Pool",
        country: "El Salvador",
        author: "Meeg von Haartman",
        image: "https://images.unsplash.com/photo-1735770515751-9b49f00d2d8c?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Piscina Azenhas do Mar",
        country: "Portugal",
        author: "Bea Vallejo",
        image: "https://images.unsplash.com/photo-1660083310880-441eb40f40bf?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Charco del Palo",
        country: "Spain",
        author: "Jordi Vich Navarro",
        image: "https://images.unsplash.com/photo-1719338388195-3587dad59abf?q=80&w=1503&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Glencairn Tidal Pool",
        country: "South Africa",
        author: "Simon Barber",
        image: "https://images.unsplash.com/photo-1662537748445-b2e851d18366?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    },

    {
        name: "Bude Sea Pool",
        country: "United Kingdom",
        author: "Nick Russil",
        image: "https://images.unsplash.com/photo-1639406077808-9dd59d374b63?q=80&w=1471&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    }

];

let current = 0;

function showImage(index) {

    current = index;

    const pool = pools[current];

    document.getElementById("poolImage").src = pool.image;

    document.getElementById("poolImage").alt = pool.name;

    document.getElementById("poolName").textContent = pool.name;

    document.getElementById("poolCountry").textContent = pool.country;

    document.getElementById("poolAuthor").textContent = pool.author;

    document.getElementById("counter").textContent =
        (current + 1) + " / " + pools.length;
}

function nextImage() {

    current++;

    if (current >= pools.length) {
        current = 0;
    }

    showImage(current);
}

function previousImage() {

    current--;

    if (current < 0) {
        current = pools.length - 1;
    }

    showImage(current);
}

/* Mostrar primera imagen */

showImage(0);

</script>

</body>
</html>
